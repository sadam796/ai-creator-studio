<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Auto Publisher</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:#fff;font-family:Arial,sans-serif;padding:16px}
.container{max-width:850px;margin:auto}
header{padding:20px 0;text-align:center}
h1{font-size:26px;margin:0 0 8px}
.subtitle{color:#9ca3af}
.card{background:#1b2130;border:1px solid #30394c;border-radius:14px;padding:18px;margin:16px 0}
h2{font-size:19px;margin-top:0}
label{display:block;margin:14px 0 6px;color:#d1d5db;font-size:14px}
input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #3c465c;background:#111827;color:white;font-size:15px}
textarea{min-height:90px;resize:vertical}
button{padding:12px 16px;border:0;border-radius:8px;background:#6366f1;color:white;font-weight:bold;font-size:14px;cursor:pointer;margin:5px 4px 5px 0}
button:disabled{opacity:.5}
.secondary{background:#374151}
.danger{background:#dc2626}
.success{background:#15803d}
.checks{display:flex;flex-wrap:wrap;gap:15px;margin-top:10px}
.checks label{display:flex;align-items:center;gap:7px;margin:0}
.checks input{width:auto}
.status{padding:10px;border-radius:8px;background:#111827;margin:8px 0;color:#d1d5db;overflow-wrap:anywhere}
.plan{background:#111827;border:1px solid #374151;border-radius:10px;padding:14px;margin:12px 0}
.plan h3{margin:0 0 8px}
.small{font-size:13px;color:#9ca3af;line-height:1.6}
.badge{display:inline-block;background:#374151;border-radius:20px;padding:5px 10px;font-size:12px;margin:5px 0}
#message{padding:12px;border-radius:8px;display:none;margin:12px 0;overflow-wrap:anywhere}
#message.ok{display:block;background:#14532d}
#message.err{display:block;background:#7f1d1d}
footer{text-align:center;color:#6b7280;padding:20px;font-size:12px}
</style>
</head>
<body>
<div class="container">

<header>
<h1>🚀 Creator Auto Publisher</h1>
<div class="subtitle">Your mobile video publishing dashboard</div>
</header>

<div class="card">
<h2>📤 Upload Your Video</h2>

<form id="planForm">
<input type="hidden" id="editId">

<label>Video File</label>
<input type="file" id="video" accept="video/*">

<label>Thumbnail Image</label>
<input type="file" id="thumbnail" accept="image/*">

<label>Video Title *</label>
<input type="text" id="title" maxlength="100" placeholder="Enter video title" required>

<label>Description</label>
<textarea id="description" placeholder="Write video description"></textarea>

<label>Tags (comma separated)</label>
<input type="text" id="tags" placeholder="video, entertainment, India">

<label>Hashtags</label>
<input type="text" id="hashtags" placeholder="#shorts #youtube">

<label>Platforms</label>
<div class="checks">
<label><input type="checkbox" name="platform" value="YouTube" checked> YouTube</label>
<label><input type="checkbox" name="platform" value="Instagram"> Instagram</label>
<label><input type="checkbox" name="platform" value="Facebook"> Facebook</label>
<label><input type="checkbox" name="platform" value="Telegram"> Telegram</label>
</div>

<label>Content Type</label>
<select id="contentType">
<option value="Video">Video</option>
<option value="Shorts">YouTube Shorts</option>
<option value="Reel">Reel</option>
</select>

<label>Publishing Date</label>
<input type="date" id="date" required>

<label>Publishing Time</label>
<input type="time" id="time" required>

<div style="margin-top:18px">
<button type="submit" id="saveBtn">💾 Save Publishing Plan</button>
<button type="button" class="secondary" id="resetBtn">Clear Form</button>
</div>
</form>

<div id="message"></div>
</div>

<div class="card">
<h2>📅 Publishing Plans</h2>
<button onclick="loadPlans()">🔄 Refresh Plans</button>
<div id="plans">
<div class="small">Loading plans...</div>
</div>
</div>

<div class="card">
<h2>⚙️ System Status</h2>
<button onclick="checkStatus()">Check Status</button>
<div id="health" class="status">Backend: Not checked</div>
<div id="youtube" class="status">YouTube: Not checked</div>
<div id="publishing" class="status">Automatic publishing: Not confirmed</div>
</div>

<footer>Creator Auto Publisher • Mobile Dashboard</footer>
</div>

<script>
const $ = id => document.getElementById(id);

let currentPlans = [];

function showMessage(message, error=false) {
  const box = $("message");
  box.textContent = message;
  box.className = error ? "err" : "ok";
}

function hideMessage() {
  $("message").style.display = "none";
  $("message").className = "";
}

async function api(url, options={}) {
  const response = await fetch(url, options);
  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || data.message || "Request failed");
  }

  return data;
}

function selectedPlatforms() {
  return [...document.querySelectorAll(
    'input[name="platform"]:checked'
  )].map(input => input.value);
}

function localDateTime(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;

  return d.toLocaleString();
}

function setDefaultDateTime() {
  const d = new Date(Date.now() + 60 * 60 * 1000);

  const local = new Date(
    d.getTime() - d.getTimezoneOffset() * 60000
  );

  $("date").value = local.toISOString().slice(0,10);
  $("time").value = local.toISOString().slice(11,16);
}

function resetForm() {
  $("planForm").reset();
  $("editId").value = "";
  $("saveBtn").textContent = "💾 Save Publishing Plan";
  $("video").required = false;
  $("thumbnail").required = false;
  setDefaultDateTime();
  hideMessage();
}

$("resetBtn").addEventListener("click", resetForm);

$("planForm").addEventListener("submit", async event => {
  event.preventDefault();
  hideMessage();

  const editId = $("editId").value;
  const videoFile = $("video").files[0];
  const thumbnailFile = $("thumbnail").files[0];

  try {
    let videoFileName = "";
    let thumbnailFileName = "";

    if (videoFile || thumbnailFile) {
      const formData = new FormData();

      if (videoFile) formData.append("video", videoFile);
      if (thumbnailFile) formData.append("thumbnail", thumbnailFile);

      const uploaded = await api("/api/upload", {
        method: "POST",
        body: formData
      });

      videoFileName = uploaded.video?.fileName || "";
      thumbnailFileName = uploaded.thumbnail?.fileName || "";
    }

    const dateTime = new Date(
      $("date").value + "T" + $("time").value
    ).toISOString();

    const body = {
      title: $("title").value.trim(),
      description: $("description").value,
      tags: $("tags").value,
      hashtags: $("hashtags").value,
      platforms: selectedPlatforms(),
      contentType: $("contentType").value,
      dateTime
    };

    let result;

    if (editId) {
      result = await api("/api/plans/" + encodeURIComponent(editId), {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(body)
      });

      showMessage("✅ Publishing plan updated!");
    } else {
      body.videoFileName = videoFileName;
      body.thumbnailFileName = thumbnailFileName;

      result = await api("/api/plans", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(body)
      });

      showMessage(result.message || "✅ Publishing plan saved!");
    }

    resetForm();
    await loadPlans();

  } catch (error) {
    showMessage("❌ " + error.message, true);
  }
});

async function loadPlans() {
  const box = $("plans");
  box.innerHTML = '<div class="small">Loading...</div>';

  try {
    const result = await api("/api/plans");
    currentPlans = result.plans || [];

    if (!currentPlans.length) {
      box.innerHTML = '<div class="small">No publishing plans yet.</div>';
      return;
    }

    box.innerHTML = "";

    currentPlans.slice().reverse().forEach(plan => {
      const item = document.createElement("div");
      item.className = "plan";

      const heading = document.createElement("h3");
      heading.textContent = plan.title || "Untitled";
      item.appendChild(heading);

      const details = document.createElement("div");
      details.className = "small";
      details.textContent =
        "Platforms: " + (plan.platforms || []).join(", ") +
        " | Date: " + localDateTime(plan.dateTime);
      item.appendChild(details);

      const badge = document.createElement("div");
      badge.className = "badge";
      badge.textContent = "Status: " + (plan.status || "unknown");
      item.appendChild(badge);

      if (plan.youtubeVideoId) {
        const link = document.createElement("a");
        link.href = "https://www.youtube.com/watch?v=" +
          encodeURIComponent(plan.youtubeVideoId);
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Open YouTube video";
        link.style.color = "#93c5fd";
        item.appendChild(document.createElement("br"));
        item.appendChild(link);
      }

      if (plan.error) {
        const error = document.createElement("p");
        error.className = "small";
        error.textContent = "Error: " + plan.error;
        item.appendChild(error);
      }

      if (plan.status === "scheduled") {
        const edit = document.createElement("button");
        edit.textContent = "✏️ Edit Plan";
        edit.onclick = () => editPlan(plan.id);
        item.appendChild(edit);

        const cancel = document.createElement("button");
        cancel.textContent = "Cancel Plan";
        cancel.className = "danger";
        cancel.onclick = () => cancelPlan(plan.id);
        item.appendChild(cancel);
      }

      box.appendChild(item);
    });

  } catch (error) {
    box.textContent = "Could not load plans: " + error.message;
  }
}

function editPlan(id) {
  const plan = currentPlans.find(p => p.id === id);
  if (!plan) return;

  $("editId").value = plan.id;
  $("title").value = plan.title || "";
  $("description").value = plan.description || "";
  $("tags").value = plan.tags || "";
  $("hashtags").value = plan.hashtags || "";
  $("contentType").value = plan.contentType || "Video";

  const d = new Date(plan.dateTime);
  const local = new Date(
    d.getTime() - d.getTimezoneOffset() * 60000
  );

  $("date").value = local.toISOString().slice(0,10);
  $("time").value = local.toISOString().slice(11,16);

  document.querySelectorAll('input[name="platform"]').forEach(input => {
    input.checked = (plan.platforms || []).includes(input.value);
  });

  $("saveBtn").textContent = "💾 Update Publishing Plan";
  showMessage("Edit the details and press Update Publishing Plan.");

  window.scrollTo({top:0,behavior:"smooth"});
}

async function cancelPlan(id) {
  if (!confirm("Are you sure you want to cancel this plan?")) return;

  try {
    const result = await api(
      "/api/plans/" + encodeURIComponent(id) + "/cancel",
      {method:"POST"}
    );

    showMessage(result.message || "Plan cancelled.");
    await loadPlans();

  } catch (error) {
    showMessage("❌ " + error.message, true);
  }
}

async function checkStatus() {
  $("health").textContent = "Checking backend...";
  $("youtube").textContent = "Checking YouTube...";
  $("publishing").textContent = "Checking publishing setting...";

  try {
    const health = await api("/api/health");

    $("health").textContent =
      "Backend: " + health.status +
      " | Upload API: " + health.uploadApi +
      " | Scheduler: " + health.scheduler;

    $("publishing").textContent =
      "Automatic publishing: " +
      (health.youtubePublishingEnabled ? "ENABLED" : "OFF");

    const yt = await api("/api/youtube/status");

    $("youtube").textContent =
      "YouTube: " +
      (yt.connected ? "Connected" : "Not connected") +
      " | " + yt.message;

  } catch (error) {
    $("health").textContent = "Status check failed: " + error.message;
    $("youtube").textContent = "YouTube status unavailable.";
    $("publishing").textContent = "Not confirmed.";
  }
}

setDefaultDateTime();
loadPlans();
checkStatus();
</script>
</body>
</html>
